<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#181a1e"><title>Sign in · Verifix</title><link rel="stylesheet" href="/static/auth.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="brand-mark"></div><p class="eyebrow">VERIFIX · PARTS INVENTORY</p><h1>Welcome back</h1><p class="muted">Sign in to access your shop workspace.</p><div class="switch" role="tablist"><button class="active" type="button" data-mode="signin">Sign in</button><button type="button" data-mode="signup">Create account</button></div><form id="auth-form"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="current-password" required></label><p id="auth-message" role="status" class="message" hidden></p><button id="submit-button" class="submit" type="submit">Sign in</button></form><p class="fine">Authentication is managed securely by Supabase.</p></section></main><script src="/static/auth.js"></script></body></html>
